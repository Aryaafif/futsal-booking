<!DOCTYPE html>
<html>
<head>
<title>Booking Futsal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>⚽ Sistem Booking Lapangan Futsal</h2>

<!-- FORM BOOKING -->
<form action="/booking" method="POST">
<input class="form-control mb-2" name="nama" placeholder="Nama" required>
<input class="form-control mb-2" type="date" name="tanggal" required>
<input class="form-control mb-2" name="jam" placeholder="Jam (contoh: 18:00)" required>
<button class="btn btn-primary">Booking</button>
</form>

<hr>

<!-- TABEL DATA -->
<table class="table table-bordered">
<tr>
<th>Nama</th>
<th>Tanggal</th>
<th>Jam</th>
<th>Status</th>
<th>Aksi</th>
</tr>

{% for d in data %}
<tr>
<td>{{d.nama}}</td>
<td>{{d.tanggal}}</td>
<td>{{d.jam}}</td>
<td>{{d.status}}</td>
<td>
<a href="/konfirmasi/{{d.id}}" class="btn btn-success btn-sm">Konfirmasi</a>
<a href="/hapus/{{d.id}}" class="btn btn-danger btn-sm">Hapus</a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
